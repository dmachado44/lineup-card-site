<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome to Pro — Leadoff</title>
  <meta name="robots" content="noindex" />
  <link rel="canonical" href="https://app.getleadoff.com/success" />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/assets/favicon-180.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Sofia+Sans+Extra+Condensed:wght@900&display=swap" rel="stylesheet">
  <style>
    /* ── Leadoff design tokens (mirrors index.html) ── */
    :root {
      --page-marketing: #FFFFFF;
      --panel:          #FFFFFF;
      --ink:            #101613;
      --ink-secondary:  #6B6659;
      --accent:         #46CF51;
      --accent-down:    #1F7A2A;
      --on-accent:      #0B2410;
      --sticker-ink:    #101613;
      --pennant:        #EC2146;
      --sticker-cream:  #FFF8E6;
      --font-display: "Sofia Sans Extra Condensed", "Arial Narrow", sans-serif;
      --font-body: "Barlow Semi Condensed", system-ui, sans-serif;
      --kicker-tracking: 0.14em;
      --radius-button: 12px;
      --radius-card: 20px;
      --shadow-sticker: 4px 4px 0 0 var(--sticker-ink);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-body);
      font-weight: 500;
      color: var(--ink);
      background: var(--page-marketing);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .logo { margin-bottom: 32px; }
    .logo img { height: 44px; display: block; }
    .card {
      background: var(--panel);
      border: 2px solid var(--sticker-ink);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-sticker);
      text-align: center;
      max-width: 480px;
      width: 100%;
      padding: 40px 36px 32px;
    }
    .pennant {
      display: inline-block;
      background: var(--pennant);
      color: var(--sticker-cream);
      font-family: var(--font-display);
      font-weight: 900;
      text-transform: uppercase;
      font-size: 13px;
      letter-spacing: var(--kicker-tracking);
      padding: 5px 20px 5px 12px;
      clip-path: polygon(0 0, calc(100% - .45em) 0, 100% 50%, calc(100% - .45em) 100%, 0 100%);
    }
    .tick {
      width: 64px; height: 64px; border-radius: 16px;
      background: var(--accent); color: var(--on-accent);
      border: 2px solid var(--sticker-ink);
      display: flex; align-items: center; justify-content: center;
      margin: 22px auto 20px;
    }
    h1 {
      font-family: var(--font-display);
      font-weight: 900;
      text-transform: uppercase;
      font-size: clamp(40px, 8vw, 52px);
      line-height: 0.94;
      margin-bottom: 14px;
    }
    p { font-size: 17px; color: var(--ink-secondary); line-height: 1.5; margin-bottom: 28px; }
    .sticker-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      font-family: var(--font-display); font-weight: 900; text-transform: uppercase;
      letter-spacing: .02em; line-height: 1; font-size: 20px;
      padding: 15px 28px; min-height: 52px; width: 100%;
      color: var(--on-accent); background: var(--accent);
      border: 2px solid var(--sticker-ink); border-radius: var(--radius-button);
      box-shadow: var(--shadow-sticker); text-decoration: none; cursor: pointer;
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .sticker-btn:hover { transform: translate(-1px,-1px); box-shadow: 5px 5px 0 0 var(--sticker-ink); }
    .sticker-btn:active { transform: translate(4px,4px); box-shadow: 0 0 0 0 var(--sticker-ink); }
    .note { font-size: 14px; color: var(--ink-secondary); margin: 16px 0 0; }
    .foot { font-size: 14px; color: var(--ink-secondary); margin-top: 28px; }
    .foot a { color: var(--accent-down); font-weight: 700; text-decoration: none; }
    @media (prefers-reduced-motion: reduce) { .sticker-btn { transition: none; } }
  </style>
</head>
<body>
  <div class="logo">
    <img src="/assets/leadoff-logo-ink.svg" alt="Leadoff" height="44" />
  </div>
  <div class="card">
    <span class="pennant">Now batting</span>
    <div class="tick" aria-hidden="true">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <h1>You're all set.</h1>
    <p>Pro is active. Unlimited teams, the fair-play lineup engine, strategy slider, game history, sharing, and priority support are ready to go.</p>
    <a href="/app" class="sticker-btn">Build your lineup</a>
    <p class="note">Your 7-day free trial has started. You won't be charged until it ends.</p>
  </div>
  <p class="foot">Questions? <a href="mailto:hello@getleadoff.com">hello@getleadoff.com</a></p>
</body>
</html>
