<div class="lo-print lo-list">
  <header class="lo-head">
    <div class="lo-head-main">
      <div class="lo-kicker">Lineup card</div>
      <h1 class="lo-title">{{GAME}}</h1>
      <div class="lo-facts">
        <div class="lo-fact"><span class="lo-fact-k">Opponent</span><span class="lo-fact-v">{{OPPONENT}}</span></div>
        <div class="lo-fact"><span class="lo-fact-k">Date</span><span class="lo-fact-v">{{DATE}}</span></div>
        <div class="lo-fact"><span class="lo-fact-k">Field</span><span class="lo-fact-v">{{FIELD}}</span></div>
      </div>
    </div>
    <div class="lo-logo" role="img" aria-label="Leadoff">@@LOGO@@</div>
  </header>
  <div class="lo-table-wrap"><table class="lo-table"><thead>{{THEAD}}</thead><tbody>{{TBODY}}</tbody></table></div>
  <section class="lo-notes"><div class="lo-notes-k">Notes</div><div class="lo-lines"></div></section>
  <footer class="lo-foot"><span>Made with <b>Leadoff</b></span><span>getleadoff.com</span></footer>
</div>
